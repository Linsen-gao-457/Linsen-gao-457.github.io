<article class="publication-entry">
  <p class="publication-entry__title">
    <span class="publication-entry__bullet" aria-hidden="true">•</span>
    <a href="{{ note.noteurl | default: note.url | relative_url }}">{{ note.title | escape }}</a>
  </p>
  {% if note.description %}<p class="publication-entry__authors">{{ note.description | escape }}</p>{% endif %}
  <div class="publication-entry__meta">
    {% if note.date %}<time datetime="{{ note.date | date_to_xmlschema }}">{{ note.date | date: "%Y-%m-%d" }}</time>{% endif %}
    <span class="publication-entry__actions">
      {% if note.slidesurl %}<a class="publication-entry__slide" href="{{ note.slidesurl }}">slide</a>{% endif %}
      {% if note.codeurl %}<a class="publication-entry__code" href="{{ note.codeurl }}">code</a>{% endif %}
    </span>
  </div>
</article>
